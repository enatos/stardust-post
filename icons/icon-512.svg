<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b16"/>
      <stop offset="100%" stop-color="#1e223d"/>
    </linearGradient>
    <linearGradient id="starGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#b4b9e4"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  
  <!-- Background tiny stars -->
  <circle cx="128" cy="138" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="384" cy="108" r="5" fill="#b4b9e4" opacity="0.8"/>
  <circle cx="96" cy="346" r="4" fill="#b4b9e4" opacity="0.5"/>
  <circle cx="400" cy="394" r="4" fill="#ffffff" opacity="0.7"/>
  <circle cx="256" cy="80" r="3" fill="#ffffff" opacity="0.4"/>
  
  <!-- Central Main 4-point Star with glow -->
  <g filter="url(#glow512)">
    <path d="M 256,118 Q 256,256 394,256 Q 256,256 256,394 Q 256,256 118,256 Q 256,256 256,118 Z" fill="url(#starGrad512)"/>
    <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  </g>
  
  <!-- Secondary small star -->
  <path d="M 352,182 Q 352,224 394,224 Q 352,224 352,266 Q 352,224 310,224 Q 352,224 352,182 Z" fill="#fbbf24" opacity="0.85"/>
</svg>
